name: Build and Release SmartGate APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*' # Triggers on any tag push starting with 'v', e.g., v1.0.0
  workflow_dispatch: # Allows manual visual building by clicking "Run workflow" on GitHub

permissions:
  contents: write # Allows the runner to create releases and upload files

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Compile Web App (Vite assets)
        run: npm run build

      - name: Sync Assets to Android Project
        run: npx cap sync android

      - name: build APK with Gradle Wrapper
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Archive build artifact for download
        uses: actions/upload-artifact@v4
        with:
          name: SmartGate-APK-Artifact
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Auto-Publish GitHub Release (Rolling Latest and Tags)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('SmartGate Release {0}', github.ref_name) || 'SmartGate Continuous Build' }}
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
